apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: iot-platform
  annotations:
    # Re-run on deploy: change the name or use helm hook
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:latest
          command:
            - /migrate
            - -path=/migrations
            - -database
            - $(DATABASE_URL)
            - up
          envFrom:
            - configMapRef:
                name: iot-config
            - secretRef:
                name: iot-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
