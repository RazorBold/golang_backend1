apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-worker
  namespace: iot-platform
  labels:
    app: iot-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: iot-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: worker
          image: iot-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iot-config
            - secretRef:
                name: iot-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
      terminationGracePeriodSeconds: 60
